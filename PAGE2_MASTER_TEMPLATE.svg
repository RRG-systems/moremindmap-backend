<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" width="816" height="1056">
  <defs>
    <style>
      * { margin: 0; padding: 0; }
      svg { overflow: visible; }
      text { font-family: Inter, Arial, sans-serif; }
    </style>
  </defs>

  <!-- WHITE PAGE BACKGROUND -->
  <rect width="816" height="1056" fill="white"/>

  <!-- HEADER SECTION -->
  <text x="40" y="45" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="1.5">MORE MINDMAP</text>
  <text x="40" y="90" font-size="28" font-weight="700" fill="#0f172a">Behavioral Operating System Map</text>
  <text x="40" y="110" font-size="11" fill="#666">System architecture: how you prioritize, decide, and respond</text>
  <text x="776" y="50" font-size="9" fill="#999" text-anchor="end" letter-spacing="0.8">BEHAVIORAL OPERATING PROFILE</text>

  <!-- DIVIDER -->
  <line x1="40" y1="125" x2="776" y2="125" stroke="#0f172a" stroke-width="2.5"/>

  <!-- DIAGRAM SECTION (Y: 160 - 900, centered X: 408) -->

  <!-- ORBIT RING (center 408, 530, radius 140) -->
  <circle cx="408" cy="530" r="140" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="3,4" opacity="0.9"/>

  <!-- SVG CONNECTORS -->
  <line x1="408" y1="230" x2="408" y2="370" stroke="#374151" stroke-width="2" stroke-dasharray="2,3"/>
  <line x1="525" y1="530" x2="680" y2="530" stroke="#374151" stroke-width="2" stroke-dasharray="2,3"/>
  <line x1="290" y1="530" x2="135" y2="530" stroke="#374151" stroke-width="2" stroke-dasharray="2,3"/>
  <line x1="408" y1="690" x2="408" y2="830" stroke="#374151" stroke-width="2" stroke-dasharray="2,3"/>

  <!-- PRIMARY DRIVER NODE (TOP, center 408, 230) -->
  <circle cx="408" cy="230" r="50" fill="#0f172a" stroke="#b8860b" stroke-width="3"/>
  <text x="408" y="237" font-size="15" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">{{PRIMARY_CODE}}</text>
  
  <text x="408" y="300" font-size="8" font-weight="800" fill="#b8860b" text-anchor="middle" letter-spacing="1.2" text-transform="uppercase">PRIMARY DRIVER</text>
  <text x="408" y="320" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">{{PRIMARY_NAME}}</text>

  <!-- PRIMARY DESCRIPTION (TOP-RIGHT SIDE) -->
  <text x="760" y="210" font-size="10" fill="#444">{{PRIMARY_DESC_1}}</text>
  <text x="760" y="227" font-size="10" fill="#444">{{PRIMARY_DESC_2}}</text>
  <text x="760" y="244" font-size="10" fill="#444">{{PRIMARY_DESC_3}}</text>

  <!-- SECONDARY NODE (RIGHT, center 680, 530) -->
  <circle cx="680" cy="530" r="45" fill="#2c5aa0" stroke="#9ca3af" stroke-width="3"/>
  <text x="680" y="537" font-size="14" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">{{SECONDARY_CODE}}</text>

  <text x="680" y="600" font-size="8" font-weight="800" fill="#b8860b" text-anchor="middle" letter-spacing="1.2" text-transform="uppercase">SECONDARY STABILIZER</text>
  <text x="680" y="620" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">{{SECONDARY_NAME}}</text>

  <!-- SECONDARY DESCRIPTION (RIGHT SIDE) -->
  <text x="745" y="460" font-size="10" fill="#444">{{SECONDARY_DESC_1}}</text>
  <text x="745" y="477" font-size="10" fill="#444">{{SECONDARY_DESC_2}}</text>
  <text x="745" y="494" font-size="10" fill="#444">{{SECONDARY_DESC_3}}</text>

  <!-- LEFT NODE (OPPOSING A, center 135, 530) -->
  <circle cx="135" cy="530" r="45" fill="#d1d5db" stroke="#9ca3af" stroke-width="3"/>
  <text x="135" y="537" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">{{OPPOSING_A_CODE}}</text>

  <text x="135" y="600" font-size="8" font-weight="800" fill="#b8860b" text-anchor="middle" letter-spacing="1.2" text-transform="uppercase">OPPOSING PATTERN</text>
  <text x="135" y="620" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">{{OPPOSING_A_NAME}}</text>

  <!-- LEFT DESCRIPTION (LEFT SIDE, right-aligned) -->
  <text x="71" y="460" font-size="10" fill="#444" text-anchor="end">{{OPPOSING_A_DESC_1}}</text>
  <text x="71" y="477" font-size="10" fill="#444" text-anchor="end">{{OPPOSING_A_DESC_2}}</text>
  <text x="71" y="494" font-size="10" fill="#444" text-anchor="end">{{OPPOSING_A_DESC_3}}</text>

  <!-- TENSION LABEL (LEFT SIDE) -->
  <text x="240" y="505" font-size="8" font-weight="700" fill="#1f2937" text-anchor="middle">TENSION</text>
  <text x="240" y="522" font-size="8" font-weight="700" fill="#1f2937" text-anchor="middle">{{TENSION_A_1}}</text>
  <text x="240" y="539" font-size="8" font-weight="700" fill="#1f2937" text-anchor="middle">{{TENSION_A_2}}</text>

  <!-- BOTTOM NODE (OPPOSING B, center 408, 830) -->
  <circle cx="408" cy="830" r="45" fill="#d1d5db" stroke="#9ca3af" stroke-width="3"/>
  <text x="408" y="837" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">{{OPPOSING_B_CODE}}</text>

  <text x="408" y="900" font-size="8" font-weight="800" fill="#b8860b" text-anchor="middle" letter-spacing="1.2" text-transform="uppercase">OPPOSING PATTERN</text>
  <text x="408" y="920" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">{{OPPOSING_B_NAME}}</text>

  <!-- BOTTOM DESCRIPTION (BELOW) -->
  <text x="480" y="770" font-size="10" fill="#444">{{OPPOSING_B_DESC_1}}</text>
  <text x="480" y="787" font-size="10" fill="#444">{{OPPOSING_B_DESC_2}}</text>
  <text x="480" y="804" font-size="10" fill="#444">{{OPPOSING_B_DESC_3}}</text>

  <!-- TENSION LABEL (BOTTOM) -->
  <text x="408" y="745" font-size="8" font-weight="700" fill="#1f2937" text-anchor="middle">TENSION: {{TENSION_B}}</text>

  <!-- CENTER ENGINE (center 408, 530, radius 65) -->
  <circle cx="408" cy="530" r="65" fill="#fafafa" stroke="#0f172a" stroke-width="4"/>
  
  <text x="408" y="500" font-size="8" font-weight="700" fill="#b8860b" text-anchor="middle" letter-spacing="1" text-transform="uppercase">CORE ENGINE</text>
  <text x="408" y="525" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">{{CORE_LINE_1}}</text>
  <text x="408" y="545" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">{{CORE_LINE_2}}</text>

  <!-- SYSTEM TENSION BOX (Y: 950-1020) -->
  <rect x="40" y="950" width="736" height="70" fill="#fafafa" stroke="#d1d5db" stroke-width="1" rx="2"/>
  <rect x="40" y="950" width="4" height="70" fill="#b8860b"/>

  <circle cx="57" cy="965" r="7" fill="#0f172a"/>
  <text x="57" y="969" font-size="9" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">⚠</text>

  <text x="75" y="969" font-size="9" font-weight="800" fill="#0f172a" letter-spacing="1" text-transform="uppercase">SYSTEM TENSION</text>

  <text x="75" y="990" font-size="9" fill="#333">{{SYSTEM_TENSION_1}}</text>
  <text x="75" y="1007" font-size="9" fill="#333">{{SYSTEM_TENSION_2}}</text>

  <!-- FOOTER -->
  <text x="408" y="1045" font-size="9" fill="#999" text-anchor="middle" letter-spacing="0.5">Page 2: Behavioral Operating System Map</text>
</svg>
