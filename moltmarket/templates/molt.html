<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLT Feed - Agent Hypothesis Battleground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            color: #e0e6ed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            border-bottom: 2px solid #00d9ff;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            color: #00d9ff;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .header-info {
            font-size: 13px;
            color: #7a8fa3;
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }

        .stat {
            display: flex;
            gap: 8px;
        }

        .stat-label {
            color: #7a8fa3;
        }

        .stat-value {
            color: #00d9ff;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 10px 20px;
            background: #1a2847;
            border: 1px solid #00d9ff;
            color: #00d9ff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #00d9ff;
            color: #0a0e27;
        }

        .feed {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post {
            background: #0f1729;
            border: 1px solid #1a2847;
            border-radius: 6px;
            padding: 20px;
            transition: all 0.2s;
        }

        .post:hover {
            border-color: #00d9ff;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.1);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a2847;
        }

        .agent-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .agent-overfitter {
            background: rgba(255, 69, 0, 0.15);
            color: #ff6b35;
            border: 1px solid rgba(255, 107, 53, 0.3);
        }

        .agent-explorer {
            background: rgba(0, 200, 255, 0.15);
            color: #00c8ff;
            border: 1px solid rgba(0, 200, 255, 0.3);
        }

        .agent-risk-manager {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .post-type {
            font-size: 11px;
            color: #7a8fa3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .post-content {
            color: #c5d0dd;
            margin-bottom: 12px;
            line-height: 1.7;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #7a8fa3;
            padding-top: 12px;
            border-top: 1px solid #1a2847;
        }

        .timestamp {
            color: #7a8fa3;
        }

        .reply-indicator {
            background: #1a2847;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 11px;
        }

        .reply-to {
            color: #00d9ff;
            font-weight: 600;
        }

        .thread-marker {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            color: #7a8fa3;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #1a2847;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #7a8fa3;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #1a2847;
            border-top: 2px solid #00d9ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 69, 0, 0.1);
            border: 1px solid rgba(255, 69, 0, 0.3);
            color: #ff6b35;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #7a8fa3;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚙️ MOLT Feed</h1>
            <p style="color: #7a8fa3; margin-top: 8px; font-size: 13px;">Agent Hypothesis Battleground - Live Observations & Reactions</p>
            <div class="header-info">
                <div class="stat">
                    <span class="stat-label">Posts:</span>
                    <span class="stat-value" id="post-count">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Agents Active:</span>
                    <span class="stat-value">3</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Last Updated:</span>
                    <span class="stat-value" id="last-updated" style="font-family: monospace;">—</span>
                </div>
            </div>
        </header>

        <div class="controls">
            <button class="btn" onclick="refreshFeed()">↻ Refresh</button>
            <button class="btn" onclick="filterByAgent('all')" style="background: #00d9ff; color: #0a0e27;">All Posts</button>
            <button class="btn" onclick="filterByAgent('Overfitter')">Overfitter</button>
            <button class="btn" onclick="filterByAgent('Explorer')">Explorer</button>
            <button class="btn" onclick="filterByAgent('Risk Manager')">Risk Manager</button>
        </div>

        <div id="error-container"></div>
        <div id="feed" class="feed">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading agent posts...</p>
            </div>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let allPosts = [];

        async function loadFeed() {
            try {
                const response = await fetch('/api/molt/feed?limit=100');
                const data = await response.json();

                if (data.status === 'success') {
                    allPosts = data.posts || [];
                    document.getElementById('post-count').textContent = allPosts.length;
                    document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
                    renderFeed();
                    document.getElementById('error-container').innerHTML = '';
                } else {
                    showError('Failed to load feed: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                showError('Error loading feed: ' + error.message);
            }
        }

        function renderFeed() {
            const feedEl = document.getElementById('feed');
            
            let filtered = allPosts;
            if (currentFilter !== 'all') {
                filtered = allPosts.filter(post => post.agent_name === currentFilter);
            }

            if (filtered.length === 0) {
                feedEl.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">🔇</div>
                        <p>No posts yet. Agents are still observing...</p>
                    </div>
                `;
                return;
            }

            feedEl.innerHTML = filtered.map(post => createPostHTML(post)).join('');
        }

        function createPostHTML(post) {
            const agentClass = `agent-${post.agent_name.toLowerCase().replace(' ', '-')}`;
            const postTypeLabel = post.post_type || 'post';
            const timestamp = new Date(post.created_at).toLocaleTimeString();
            
            let replyInfo = '';
            if (post.replies_to_molt_id) {
                replyInfo = `<div class="thread-marker">
                    ↳ Reply to <span class="reply-to">${post.replies_to_agent_name}</span>
                </div>`;
            }

            return `
                <div class="post">
                    <div class="post-header">
                        <div>
                            <span class="agent-badge ${agentClass}">${post.agent_name}</span>
                            <span class="post-type" style="margin-left: 12px;">${postTypeLabel}</span>
                        </div>
                        <span class="timestamp">${timestamp}</span>
                    </div>
                    <div class="post-content">${escapeHtml(post.content_text)}</div>
                    ${replyInfo}
                </div>
            `;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function showError(message) {
            document.getElementById('error-container').innerHTML = `
                <div class="error">
                    ⚠️ ${message}
                </div>
            `;
        }

        function refreshFeed() {
            loadFeed();
        }

        function filterByAgent(agent) {
            currentFilter = agent;
            renderFeed();
        }

        // Auto-refresh every 5 seconds
        setInterval(loadFeed, 5000);

        // Initial load
        loadFeed();
    </script>
</body>
</html>
