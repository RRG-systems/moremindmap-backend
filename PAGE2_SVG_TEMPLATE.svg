<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 1100" width="850" height="1100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .header-logo { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #b8860b; letter-spacing: 1.5px; }
      .header-title { font-family: Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #0f172a; }
      .header-subtitle { font-family: Arial, sans-serif; font-size: 12px; fill: #666; }
      .header-breadcrumb { font-family: Arial, sans-serif; font-size: 10px; fill: #999; letter-spacing: 1px; }
      .divider { stroke: #0f172a; stroke-width: 2.5; }
      .orbit-ring { stroke: #6b7280; stroke-width: 2.5; stroke-dasharray: 3,4; fill: none; opacity: 0.9; }
      .connector { stroke: #374151; stroke-width: 2; stroke-dasharray: 2,3; fill: none; }
      .node-circle { fill-opacity: 1; stroke-width: 3; }
      .node-circle.primary { fill: #0f172a; stroke: #b8860b; }
      .node-circle.secondary { fill: #2c5aa0; stroke: #9ca3af; }
      .node-circle.opposing { fill: #d1d5db; stroke: #9ca3af; }
      .node-circle.center { fill: #fafafa; stroke: #0f172a; }
      .node-code { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: white; text-anchor: middle; dominant-baseline: middle; }
      .node-code.center { fill: #0f172a; }
      .node-label { font-family: Arial, sans-serif; font-size: 9px; font-weight: 800; fill: #b8860b; text-anchor: middle; letter-spacing: 1.2px; text-transform: uppercase; }
      .node-name { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .center-label { font-family: Arial, sans-serif; font-size: 9px; font-weight: 700; fill: #b8860b; text-anchor: middle; letter-spacing: 1px; text-transform: uppercase; }
      .center-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .diagnostic-text { font-family: Arial, sans-serif; font-size: 11px; fill: #444; line-height: 1.4; }
      .tension-label { font-family: Arial, sans-serif; font-size: 9px; font-weight: 700; fill: #1f2937; text-anchor: middle; }
      .tension-box-title { font-family: Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #0f172a; letter-spacing: 1.2px; text-transform: uppercase; }
      .tension-box-text { font-family: Arial, sans-serif; font-size: 10px; fill: #333; line-height: 1.4; }
      .legend-label { font-family: Arial, sans-serif; font-size: 9px; font-weight: 700; fill: #0f172a; }
      .legend-text { font-family: Arial, sans-serif; font-size: 9px; fill: #666; }
      .footer-text { font-family: Arial, sans-serif; font-size: 10px; fill: #999; text-anchor: middle; letter-spacing: 0.5px; }
    </style>
  </defs>
  
  <!-- WHITE BACKGROUND -->
  <rect width="850" height="1100" fill="white"/>
  
  <!-- HEADER -->
  <text x="40" y="45" class="header-logo">MORE MINDMAP</text>
  <text x="40" y="85" class="header-title">Behavioral Operating System Map</text>
  <text x="40" y="105" class="header-subtitle">System architecture: how you prioritize, decide, and respond</text>
  <text x="810" y="50" class="header-breadcrumb" text-anchor="end">BEHAVIORAL OPERATING PROFILE</text>
  
  <!-- DIVIDER -->
  <line x1="40" y1="125" x2="810" y2="125" class="divider"/>
  
  <!-- DIAGRAM CONTAINER (400-900 Y range, 425-825 X center) -->
  
  <!-- ORBIT RING -->
  <circle cx="425" cy="550" r="140" class="orbit-ring"/>
  
  <!-- CONNECTORS (SVG lines) -->
  <line x1="425" y1="250" x2="425" y2="380" class="connector"/>
  <line x1="535" y1="550" x2="700" y2="550" class="connector"/>
  <line x1="315" y1="550" x2="150" y2="550" class="connector"/>
  <line x1="425" y1="720" x2="425" y2="850" class="connector"/>
  
  <!-- PRIMARY DRIVER (TOP) -->
  <circle cx="425" cy="250" r="50" class="node-circle primary"/>
  <text x="425" y="250" class="node-code">{{PRIMARY_CODE}}</text>
  <text x="425" y="330" class="node-label">PRIMARY DRIVER</text>
  <text x="425" y="355" class="node-name">{{PRIMARY_NAME}}</text>
  
  <!-- PRIMARY DESCRIPTION (TOP-RIGHT) -->
  <g>
    <text x="750" y="210" class="diagnostic-text">{{PRIMARY_DESCRIPTION_LINE_1}}</text>
    <text x="750" y="227" class="diagnostic-text">{{PRIMARY_DESCRIPTION_LINE_2}}</text>
    <text x="750" y="244" class="diagnostic-text">{{PRIMARY_DESCRIPTION_LINE_3}}</text>
  </g>
  
  <!-- SECONDARY STABILIZER (RIGHT) -->
  <circle cx="700" cy="550" r="45" class="node-circle secondary"/>
  <text x="700" y="550" class="node-code">{{SECONDARY_CODE}}</text>
  <text x="700" y="620" class="node-label">SECONDARY STABILIZER</text>
  <text x="700" y="642" class="node-name">{{SECONDARY_NAME}}</text>
  
  <!-- SECONDARY DESCRIPTION (RIGHT-SIDE) -->
  <g>
    <text x="760" y="470" class="diagnostic-text">{{SECONDARY_DESCRIPTION_LINE_1}}</text>
    <text x="760" y="487" class="diagnostic-text">{{SECONDARY_DESCRIPTION_LINE_2}}</text>
    <text x="760" y="504" class="diagnostic-text">{{SECONDARY_DESCRIPTION_LINE_3}}</text>
  </g>
  
  <!-- OPPOSING LEFT (SIGNAL) -->
  <circle cx="150" cy="550" r="45" class="node-circle opposing"/>
  <text x="150" y="550" class="node-code">{{OPPOSING_A_CODE}}</text>
  <text x="150" y="620" class="node-label">OPPOSING PATTERN</text>
  <text x="150" y="642" class="node-name">{{OPPOSING_A_NAME}}</text>
  
  <!-- OPPOSING LEFT DESCRIPTION -->
  <g text-anchor="end">
    <text x="85" y="470" class="diagnostic-text">{{OPPOSING_A_DESCRIPTION_LINE_1}}</text>
    <text x="85" y="487" class="diagnostic-text">{{OPPOSING_A_DESCRIPTION_LINE_2}}</text>
    <text x="85" y="504" class="diagnostic-text">{{OPPOSING_A_DESCRIPTION_LINE_3}}</text>
  </g>
  
  <!-- TENSION LABEL (LEFT) -->
  <text x="250" y="530" class="tension-label" text-anchor="middle">TENSION</text>
  <text x="250" y="548" class="tension-label" text-anchor="middle">{{OPPOSING_A_TENSION_LINE_1}}</text>
  <text x="250" y="566" class="tension-label" text-anchor="middle">{{OPPOSING_A_TENSION_LINE_2}}</text>
  
  <!-- OPPOSING BOTTOM (FLEX) -->
  <circle cx="425" cy="850" r="45" class="node-circle opposing"/>
  <text x="425" y="850" class="node-code">{{OPPOSING_B_CODE}}</text>
  <text x="425" y="920" class="node-label">OPPOSING PATTERN</text>
  <text x="425" y="942" class="node-name">{{OPPOSING_B_NAME}}</text>
  
  <!-- OPPOSING BOTTOM DESCRIPTION -->
  <g>
    <text x="500" y="790" class="diagnostic-text">{{OPPOSING_B_DESCRIPTION_LINE_1}}</text>
    <text x="500" y="807" class="diagnostic-text">{{OPPOSING_B_DESCRIPTION_LINE_2}}</text>
    <text x="500" y="824" class="diagnostic-text">{{OPPOSING_B_DESCRIPTION_LINE_3}}</text>
  </g>
  
  <!-- TENSION LABEL (BOTTOM) -->
  <text x="425" y="755" class="tension-label" text-anchor="middle">TENSION: {{OPPOSING_B_TENSION}}</text>
  
  <!-- CENTER ENGINE -->
  <circle cx="425" cy="550" r="65" class="node-circle center"/>
  <text x="425" y="520" class="center-label">CORE ENGINE</text>
  <text x="425" y="545" class="center-text">{{CORE_ENGINE_LINE_1}}</text>
  <text x="425" y="565" class="center-text">{{CORE_ENGINE_LINE_2}}</text>
  
  <!-- SYSTEM TENSION BOX -->
  <rect x="40" y="990" width="770" height="85" fill="#fafafa" stroke="#d1d5db" stroke-width="1" rx="3"/>
  <rect x="40" y="990" width="5" height="85" fill="#b8860b"/>
  
  <!-- TENSION ICON -->
  <circle cx="57" cy="1007" r="8" fill="#0f172a"/>
  <text x="57" y="1011" class="tension-box-title" text-anchor="middle" font-size="10" fill="white">⚠</text>
  
  <text x="75" y="1011" class="tension-box-title">SYSTEM TENSION</text>
  
  <!-- TENSION TEXT -->
  <text x="75" y="1034" class="tension-box-text">{{SYSTEM_TENSION_LINE_1}}</text>
  <text x="75" y="1051" class="tension-box-text">{{SYSTEM_TENSION_LINE_2}}</text>
  
  <!-- LEGEND -->
  <text x="75" y="1070" class="tension-box-title" font-size="9">SYSTEM LEGEND</text>
  
  <circle cx="85" cy="1088" r="4" fill="#0f172a"/>
  <text x="100" y="1091" class="legend-label">Primary Driver</text>
  <text x="280" y="1091" class="legend-text">— Sets your default operating standard</text>
  
  <!-- FOOTER -->
  <text x="425" y="1100" class="footer-text">Page 2: Behavioral Operating System Map</text>
</svg>
